# Rendered directly into kubectl stdin, never stored in Helm release values.
# Create/replace avoids storing stringData in a last-applied annotation.
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-credentials
  namespace: capsule-observability
  resourceVersion: "${MONITORING_SECRET_RESOURCE_VERSION}"
type: Opaque
stringData:
  username: ${MONITORING_USERNAME_JSON}
  password: ${MONITORING_PASSWORD_JSON}
