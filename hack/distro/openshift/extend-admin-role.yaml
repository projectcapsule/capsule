kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: extend-admin-role
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: 'true'
rules:
  - verbs:
      - update
    apiGroups:
      - capsule.clastix.io
    resources:
      - '*/finalizers'
  # Kubernetes' view role grants this, OpenShift's admin role does not
  - verbs:
      - get
      - list
      - watch
    apiGroups:
      - ''
    resources:
      - namespaces
  # OwnerReferencesPermissionEnforcement is enabled on OpenShift
  - verbs:
      - update
    apiGroups:
      - apps
    resources:
      - deployments/finalizers
      - replicasets/finalizers
      - statefulsets/finalizers
      - daemonsets/finalizers
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - restricted-v2
      - nonroot-v2
    verbs:
      - 'use'
