title: Capsule Namespace Profiling Threat Catalog
metadata:
  id: CAPSULE.THR
  type: ThreatCatalog
  gemara-version: "1.6.0"
  version: "0.3.0"
  date: "2026-10-15T07:07:09Z"
  draft: false
  author:
    id: codex
    name: Codex
    type: Software
    description: Repository-derived assessment; maintainer approval is recorded below.
  description: |
    Scoped threat assessment of the Capsule controller, namespace
    profiling rules, admission, and shipped deployment and release configuration.
    Scope, trust boundaries, assumptions, exclusions, and assessed runtime
    revision are defined in the companion CAPSULE.CAP catalog. Threats describe
    possible adverse scenarios, including scenarios with existing defenses;
    they are not claims of confirmed vulnerabilities or an independent audit.
    Current defenses describe source behavior. Residual risks include operator
    configuration, trusted policy authors, asynchronous reconciliation, and
    dependencies. Referenced tests are coverage evidence, not pass attestations.

    Maintainer approval: Oliver Bähler (https://github.com/oliverbaehler)
    approved version 0.3.0 for publication on 2026-10-15. The metadata date
    records when this approval took effect, not publication. Approval retains
    the assessed runtime revision, scope, assumptions, and limitations of this
    assessment.

    Advisory snapshot: 2026-10-13. Historical advisory ranges and patch versions
    below are reported by their publishers. Follow-up advisories demonstrate
    incomplete fixes; a first patched version is not proof that every alternate
    input path was protected. Current defenses refer to the assessed source,
    and referenced tests require execution before they establish a passing
    regression.

    Capsule Proxy implementation is excluded. Its published advisories identify
    integration risks to request identity and confidentiality that adopters
    must assess separately:
    - GHSA-9cwv-cppx-mqjm / CVE-2022-23652: hop-by-hop Connection headers can
      interfere with authenticated forwarding using privileged credentials.
      The advisory reports affected versions <= v0.2.0 and names v0.2.1 as the
      patch in its description.
      https://github.com/projectcapsule/capsule-proxy/security/advisories/GHSA-9cwv-cppx-mqjm
    - GHSA-fpvw-6m5v-hqfp / CVE-2023-48312: missing validation of the TokenReview
      authentication result allows invalid or empty bearer tokens through.
      The advisory reports affected versions <= 0.4.5 and patch 0.4.6.
      https://github.com/projectcapsule/capsule-proxy/security/advisories/GHSA-fpvw-6m5v-hqfp
    - GHSA-6758-979h-249x / CVE-2023-46254: same-named ServiceAccounts in
      different namespaces are confused by cached owner resolution, exposing
      other tenants' Namespace metadata. The advisory reports affected
      versions <= 0.4.4 and patch 0.4.5.
      https://github.com/projectcapsule/capsule-proxy/security/advisories/GHSA-6758-979h-249x
    - GHSA-xm6f-mhqj-9592: ambiguous concatenation of subject kind, namespace,
      and name creates RoleBinding index-key collisions and grants another
      tenant's namespace read set. The advisory reports affected versions
      <= 0.13.4 and patch 0.15.0. Including namespace in a key is insufficient
      when distinct tuples can encode to the same string.
      https://github.com/projectcapsule/capsule-proxy/security/advisories/GHSA-xm6f-mhqj-9592
    - GHSA-pvhj-cqh2-rpq8: tenant-writable ProxySetting clusterResources can
      self-grant reads served with the proxy ServiceAccount without ownership
      or authorization checks. The advisory reports affected versions
      <= 0.14.1 and patch 0.15.0. Default namespace disclosure and feature-gated
      arbitrary cluster-scoped reads have different blast radii.
      https://github.com/projectcapsule/capsule-proxy/security/advisories/GHSA-pvhj-cqh2-rpq8
    These advisories do not establish current Proxy defenses. A project-wide
    assessment needs a separately reviewed Proxy scope and source revision.
  mapping-references:
    - id: CAPSULE.CAP
      title: Capsule Namespace Profiling Capability Catalog
      version: "0.3.0"
      url: https://raw.githubusercontent.com/projectcapsule/capsule/main/security/capabilities.yaml
      description: Scope and capabilities exploited by the threats in this catalog.
imports:
