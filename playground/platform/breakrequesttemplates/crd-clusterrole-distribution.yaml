# Creates a temporary ClusterRole for one namespaced CRD and a TenantResource
# which distributes that role through RoleBindings in every namespace of the
# Tenant. The TenantResource runs as a promoted ServiceAccount; see
# ../tenantresources/gateway-api-role-distributor.yaml.
#
# The example BreakRequest uses the Gateway API HTTPRoute CRD. The same
# template can be used for another namespaced CRD by changing crdName. The
# selected distributor ServiceAccount must be allowed to bind roleName.
apiVersion: capsule.clastix.io/v1beta2
kind: BreakRequestTemplate
metadata:
  name: crd-clusterrole-distribution
spec:
  namespaceSelectors:
    - matchLabels:
        projectcapsule.dev/tenant: solar
  autoApprove: true
  defaultDuration: 1h
  maxDuration: 8h
  keepFor: 7d
  paramSchema:
    type: object
    additionalProperties: false
    required:
      - roleName
      - tenantResourceName
      - roleBindingName
      - crdName
      - serviceAccountName
      - subjectKind
      - subjectName
    properties:
      roleName:
        type: string
        description: Name of the temporary ClusterRole distributed across the Tenant.
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        maxLength: 63
      tenantResourceName:
        type: string
        description: Name of the TenantResource which distributes the ClusterRole.
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        maxLength: 63
      roleBindingName:
        type: string
        description: Name of the RoleBinding created in each Tenant namespace.
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        maxLength: 63
      crdName:
        type: string
        description: Name of a namespaced CRD, for example httproutes.gateway.networking.k8s.io.
        minLength: 1
        maxLength: 253
      serviceAccountName:
        type: string
        description: Promoted ServiceAccount used by the TenantResource.
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        maxLength: 63
      subjectKind:
        type: string
        description: Kind of subject receiving the temporary CRD permissions.
        enum:
          - User
          - Group
      subjectName:
        type: string
        description: Name of the user or group receiving the temporary CRD permissions.
        minLength: 1
  context:
    resources:
      - apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: '{{ .crdName }}'
        index: crd
        optional: false
  resources:
    - policy:
        creation: Owner
        protect: true
        force: false
      targets:
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: '{{ .roleName }}'
          rules:
            - apiGroups:
                - '{{ (index .crd 0).spec.group }}'
              resources:
                - '{{ (index .crd 0).spec.names.plural }}'
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
                - deletecollection

    - policy:
        creation: Owner
        protect: true
        force: false
      targets:
        - apiVersion: capsule.clastix.io/v1beta2
          kind: TenantResource
          metadata:
            name: '{{ .tenantResourceName }}'
          spec:
            serviceAccount:
              name: '{{ .serviceAccountName }}'
            resyncPeriod: 30s
            pruningOnDelete: true
            resources:
              - rawItems:
                  - apiVersion: rbac.authorization.k8s.io/v1
                    kind: RoleBinding
                    metadata:
                      name: '{{ .roleBindingName }}'
                    roleRef:
                      apiGroup: rbac.authorization.k8s.io
                      kind: ClusterRole
                      name: '{{ .roleName }}'
                    subjects:
                      - apiGroup: rbac.authorization.k8s.io
                        kind: '{{ .subjectKind }}'
                        name: '{{ .subjectName }}'
