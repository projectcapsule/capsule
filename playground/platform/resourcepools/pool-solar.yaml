kind: ResourcePool
metadata:
  name: solar
  labels:
    projectcapsule.dev/tenant: solar
spec:
  quota:
    hard:
      limits.cpu: "2"
      limits.memory: 2Gi
      requests.cpu: "2"
      requests.memory: 2Gi
      requests.storage: "5Gi"
  selectors:
  - matchLabels:
      capsule.clastix.io/tenant: solar
