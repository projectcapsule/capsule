---
apiVersion: capsule.clastix.io/v1beta2
kind: ResourcePool
metadata:
  name: solar
  labels:
    projectcapsule.dev/tenant: solar
spec:
  quota:
    hard:
      limits.cpu: "0"
      requests.cpu: "2"
      requests.memory: "2Gi"
      limits.memory: "4Gi"
      requests.nvidia.com/gpu: 8
  selectors:
  - matchLabels:
      capsule.clastix.io/tenant: solar
