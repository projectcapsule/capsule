# Creates a temporary ClusterRole for one namespaced CRD and a TenantResource
# which distributes that role through RoleBindings in every namespace of the
# Tenant. The TenantResource runs as a promoted ServiceAccount; see
# ../tenantresources/gateway-api-role-distributor.yaml.
#
# The example BreakRequest uses the Gateway API HTTPRoute CRD. The same
# template can be used for another namespaced CRD by changing crdName. The
# selected distributor ServiceAccount must be allowed to bind roleName.
apiVersion: capsule.clastix.io/v1beta2
kind: GlobalBreakRequestTemplate
metadata:
  name: clusterrole-distribution
  labels:
    company.com/consumer: "tenants"
  annotations:  
    info.projectcapsule.dev/icon: "fa-solid fa-chart-line"
    info.projectcapsule.dev/description: "Request temporary elevated permissions for a namespaced CRD across all Tenant namespaces."
    info.projectcapsule.dev/tags: "rbac,security"
spec:
  namespaceSelectors:
    - matchLabels:
       capsule.clastix.io/tenant: solar
  approvals:
    auto: true
  defaultDuration: 1h
  maxDuration: 8h
  keepFor: 7d
  paramSchema:
    type: object
    additionalProperties: false
    required:
      - roleName
      - tenantResourceName
      - roleBindingName
      - crdName
      - serviceAccountName
      - subjectKind
      - subjectName
    properties:
      roleName:
        type: string
        description: Name of the temporary ClusterRole.
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        maxLength: 63
      tenantResourceName:
        type: string
        description: Name of the temporary TenantResource.
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        maxLength: 63
      roleBindingName:
        type: string
        description: Name of the RoleBinding distributed to Tenant namespaces.
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        maxLength: 63
      crdName:
        type: string
        description: Name of a namespaced CRD, for example httproutes.gateway.networking.k8s.io.
        minLength: 1
        maxLength: 253
        x-capsule-form:
          widget: kubernetes-resource
          source:
            apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
          option:
            labelTemplate: '{{ .metadata.name }}'
            valueTemplate: '{{ .metadata.name }}'
      serviceAccountName:
        type: string
        description: Promoted ServiceAccount used by the TenantResource.
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        maxLength: 63
      subjectKind:
        type: string
        description: Kind of subject receiving the temporary CRD permissions.
        enum:
          - User
          - Group
          - ServiceAccount
      subjectName:
        type: string
        description: User/group name, or namespace/name for a ServiceAccount.
        minLength: 1
    x-kubernetes-validations:
      - rule: >-
          self.subjectKind != 'ServiceAccount' ||
          self.subjectName.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?/[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$')
        message: ServiceAccount subjects must use namespace/name
        reason: FieldValueInvalid
        fieldPath: .subjectName
  context:
    resources:
      - apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: '{{ .crdName }}'
        index: crd
        optional: false
  resources:
    - policy:
        creation: Owner
        protect: true
        force: false
      targets:
        - apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: '{{ .roleName }}'
          rules:
            - apiGroups:
                - '{{ (index .crd 0).spec.group }}'
              resources:
                - '{{ (index .crd 0).spec.names.plural }}'
              verbs:
                - get
                - list
                - watch
                - create
                - update
                - patch
                - delete
                - deletecollection

    - policy:
        creation: Owner
        protect: true
        force: false
        deletion: Remove
      template: |
        apiVersion: capsule.clastix.io/v1beta2
        kind: TenantResource
        metadata:
          name: '{{ $.params.tenantResourceName }}'
        spec:
          serviceAccount:
            name: '{{ $.params.serviceAccountName }}'
          resyncPeriod: 30s
          pruningOnDelete: true
          resources:
            - rawItems:
                - apiVersion: rbac.authorization.k8s.io/v1
                  kind: RoleBinding
                  metadata:
                    name: '{{ $.params.roleBindingName }}'
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: ClusterRole
                    name: '{{ $.params.roleName }}'
                  subjects:
                    {{ if eq $.params.subjectKind "ServiceAccount" }}
                    - kind: ServiceAccount
                      namespace: '{{ index (splitList "/" $.params.subjectName) 0 }}'
                      name: '{{ index (splitList "/" $.params.subjectName) 1 }}'
                    {{ else }}
                    - apiGroup: rbac.authorization.k8s.io
                      kind: '{{ $.params.subjectKind }}'
                      name: '{{ $.params.subjectName }}'
                    {{ end }}
