apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: solar
  labels:
    customer: renewable
  annotations:
    info.projectcapsule.dev/icon: https://cdn-icons-png.flaticon.com/512/3463/3463440.png
    info.projectcapsule.dev/description: "Production tenant for the solar team"
    info.projectcapsule.dev/links: '[{"title":"Grafana","url":"https://grafana.example.com/d/payments","icon":"mdi:grafana"},{"title":"Runbook","url":"https://wiki.example.com/payments-runbook", "icon":  "icon": "fa-solid fa-chart-line"}]'
spec:
  permissions:
    matchOwners:
      - matchLabels:
          team: platform
      - matchLabels:
          customer: renewable
  rules:
    # Placement applies to test namespaces; production keeps its own profile.
    - namespaceSelector:
        matchLabels:
          env: test
      mutate:
        - conditions:
            - name: linux-default
              expression: "!has(object.spec.nodeSelector) || !('kubernetes.io/os' in object.spec.nodeSelector)"
          workloads:
            placement:
              nodeSelector:
                kubernetes.io/os: linux
        - action: merge
          conditions:
            - name: shared-pool
              expression: "has(object.metadata.labels) && 'placement.example.com/pool' in object.metadata.labels && object.metadata.labels['placement.example.com/pool'] == 'shared'"
          workloads:
            placement:
              nodeSelector:
                placement.example.com/pool: shared
              tolerations:
                - key: infrastructure.example.com/dedicated
                  operator: Equal
                  value: shared
                  effect: NoSchedule
        - action: replace
          conditions:
            - name: shared-pool
              expression: "has(object.metadata.labels) && 'placement.example.com/pool' in object.metadata.labels && object.metadata.labels['placement.example.com/pool'] == 'shared'"
            - name: default-scheduler
              expression: "!has(object.spec.schedulerName) || object.spec.schedulerName in ['', 'default-scheduler']"
          workloads:
            placement:
              # This demo scheduler is not installed; the example Pod has a scheduling gate.
              scheduler: solar-shared-scheduler
      enforce:
        conditions:
          - name: pod-request
            expression: "request.kind.kind == 'Pod' && (!has(request.kind.group) || request.kind.group == '')"
        action: allow
        workloads:
          placement:
            nodeSelector:
              - key:
                  exact: [kubernetes.io/os]
                values:
                  exact: [linux]
              - key:
                  exp: '^placement\.example\.com/[a-z0-9-]+$'
                values:
                  exact: [shared, batch]
            affinity:
              - types: [nodeAffinity]
                modes: [required, preferred]
                requirements:
                  - key:
                      exact: [topology.kubernetes.io/zone]
                    operators: [In]
                    values:
                      exact: [zone-a, zone-b]
              - types: [podAffinity, podAntiAffinity]
                modes: [preferred]
                topologyKey:
                  exact: [kubernetes.io/hostname]
                namespaceScope: SameNamespace
                weight:
                  min: 1
                  max: 100
    # A target without workload policies matches the native kind itself.
    - namespaceSelector:
        matchLabels:
          env: test
      enforce:
        action: deny
        workloads:
          targets: [daemonset]
    # With policies, targets scope those checks to the Deployment template.
    - namespaceSelector:
        matchLabels:
          env: test
      enforce:
        action: deny
        workloads:
          targets: [deployment/containers]
          registries:
            - exact: ['example.com/blocked/app:v1']
          resources:
            requests:
              memory:
                policy: Default
                value: 32Mi
    # Promote only the dedicated TenantResource ServiceAccount. Capsule binds
    # this distributor role in every solar namespace so the TenantResource can
    # create the temporary user-facing RoleBindings there.
    - permissions:
        promotions:
          - clusterRoles:
              - gateway-api-role-distributor
              - admin
    - namespaceSelector:
        matchExpressions:
          - key: env
            operator: In
            values:
              - "test"
      permissions:
        promotions:
          - clusterRoles:
              - "secret-replicator"
    - permissions:
        bindings:
          - clusterRoleName: 'custom:proxy-viewer'
            subjects:
              - apiGroup: rbac.authorization.k8s.io
                kind: User
                name: gatsby
            labels:
              reflection.proxy.projectcapsule.dev/enabled: "true"
      enforce:
        action: deny
        metadata:
          - apiGroups:
              - "v1"
            kinds:
              - "Namespace"
            labels:
              pod-security.kubernetes.io/enforce:
                managed: "baseline"
    - audience:
        - kind: "Custom"
          name: "CapsuleUser"
      enforce:
        action: deny
        metadata:
          - apiGroups:
              - "v1"
            kinds:
              - "Namespace"
            labels:
              "openshift.io/*":
                required: false
                values:
                  - exp: "^.*$"
    - namespaceSelector:
        matchExpressions:
          - key: env
            operator: In
            values:
              - "test"
      permissions:
        promotions:
          - clusterRoles:
              - "secret-replicator"
    # Opt-in security profiles. Label a namespace security-profile=confined.
    - namespaceSelector:
        matchLabels:
          security-profile: confined
      mutate:
        - action: merge
          workloads:
            # pod includes regular, init/sidecar and newly added ephemeral containers.
            targets: [pod]
            security:
              readOnlyRootFilesystem: true
              seccompProfile:
                type: RuntimeDefault
            registries:
              imagePullPolicy: Always
      enforce:
        action: allow
        workloads:
          security:
            seccompProfiles:
              - types: [RuntimeDefault]
    # Enable separately, only on nodes with AppArmor support.
    - namespaceSelector:
        matchLabels:
          security-profile: confined
          apparmor: enabled
      mutate:
        - action: merge
          workloads:
            security:
              appArmorProfile:
                type: RuntimeDefault
      enforce:
        action: allow
        workloads:
          security:
            appArmorProfiles:
              - types: [RuntimeDefault]
