---
apiVersion: capsule.clastix.io/v1beta2
kind: Tenant
metadata:
  name: solar
  labels:
    customer: renewable
  annotations:
    info.projectcapsule.dev/icon: https://cdn-icons-png.flaticon.com/512/3463/3463440.png
    info.projectcapsule.dev/description: "Production tenant for the solar team"
    info.projectcapsule.dev/links: '[{"title":"Grafana","url":"https://grafana.example.com/d/payments","icon":"mdi:grafana"},{"title":"Runbook","url":"https://wiki.example.com/payments-runbook", "icon":  "icon": "fa-solid fa-chart-line"}]'
spec:
  permissions:
    matchOwners:
    - matchLabels:
        team: platform
    - matchLabels:
        customer: renewable
  rules:
    - mutate:
        - workloads:
            nodeSelector:
              kubernetes.io/os: linux
        - conditions:
            - apiGroup: ""
              kind: "Pod"
              expressions:
                - "request (Admission)"
                - "self.spec.containers.nodeSelector == nil"
          workloads:
            tolerations:
              - key: infrastructure.example.com/dedicated
                operator: Equal
                value: shared
                effect: NoSchedule


      validate:
        - action: "deny"
          conditons:
            - apiGroup: ""
              kind: "Pod"
              conditions:
                - "request (Admission)"
                - "self.spec.containers.nodeSelector == nil"

      enforce:
        action: allow
        workloads:
          nodeSelector:
            - key:
                exact: [kubernetes.io/os]
              values:
                exp: ".*"
            - key:
                exp: '^placement\.example\.com/[a-z0-9-]+$'
              values:
                exact: [shared, batch]

          affinity:
            - types: [nodeAffinity]
              modes: [required, preferred]
              requirements:
                - key:
                    exact: [topology.kubernetes.io/zone]
                  operators: [In]
                  values:
                    exact: [zone-a, zone-b]
            - types: [podAffinity, podAntiAffinity]
              modes: [preferred]
              topologyKey:
                exact: [kubernetes.io/hostname]
              namespaceScope: SameNamespace
              weight:
                min: 1
                max: 100

    # Promote only the dedicated TenantResource ServiceAccount. Capsule binds
    # this distributor role in every solar namespace so the TenantResource can
    # create the temporary user-facing RoleBindings there.
    - permissions:
        promotions:
          - clusterRoles:
              - gateway-api-role-distributor
              - admin
    - namespaceSelector:
        matchExpressions:
          - key: env
            operator: In
            values:
              - "test"
      permissions:
        promotions:
          - clusterRoles:
              - "secret-replicator"
    - permissions:
        bindings:
          - clusterRoleName: 'custom:proxy-viewer'
            subjects:
              - apiGroup: rbac.authorization.k8s.io
                kind: User
                name: gatsby
            labels:
              reflection.proxy.projectcapsule.dev/enabled: "true"
      enforce:
        action: deny
        metadata:
          - apiGroups:
              - "v1"
            kinds:
              - "Namespace"
            labels:
              pod-security.kubernetes.io/enforce:
                managed: "baseline"
    - audience:
        - kind: "Custom"
          name: "CapsuleUser"
      enforce:
        action: deny
        metadata:
          - apiGroups:
              - "v1"
            kinds:
              - "Namespace"
            labels:
              "openshift.io/*":
                required: false
                values:
                  - exp: "^.*$"
    - namespaceSelector:
        matchExpressions:
          - key: env
            operator: In
            values:
              - "test"
      permissions:
        promotions:
          - clusterRoles:
              - "secret-replicator"
