apiVersion: v1
kind: Pod
metadata:
  name: placement-default
  namespace: solar-test
  labels:
    app: placement-demo
spec:
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
