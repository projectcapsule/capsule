apiVersion: v1
kind: Pod
metadata:
  name: placement-shared
  namespace: solar-test
  labels:
    app: placement-demo
    placement.example.com/pool: shared
spec:
  # Keep the example pending: playground nodes do not have a shared pool label.
  schedulingGates:
    - name: placement.example.com/demo
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
