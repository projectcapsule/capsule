# Bootstrap resources for the temporary Gateway API access example.
#
# The ServiceAccount is promoted by the matching rule on the solar Tenant. The
# promotion creates RoleBindings for gateway-api-role-distributor in every
# solar namespace. This gives the TenantResource enough authority to distribute
# only temporary-gateway-api-httproute-editor; it does not grant the
# ServiceAccount any HTTPRoute permissions of its own.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-management
  namespace: solar-system
data:
  team-a: |
    quota:
      requests.cpu: "1"
      requests.memory: "1Gi"
      limits.memory: "2Gi"
      requests.nvidia.com/gpu: 4
    owners:
      - kind: User
        name: alice
      - kind: User
        name: bob
  team-b: |
    quota:
      requests.cpu: "1"
      requests.memory: "1Gi"
      limits.memory: "2Gi"
      requests.nvidia.com/gpu: 4
    owners:
      - kind: User
        name: alice
      - kind: User
        name: bob
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-api-role-distributor
  namespace: solar-system
  labels:
    projectcapsule.dev/promote: "true"
---
apiVersion: capsule.clastix.io/v1beta2
kind: TenantResource
metadata:
  name: tenant-distribution
  namespace: solar-system
spec:
  resyncPeriod: 60s
  serviceAccount:
    name: gateway-api-role-distributor
  resources:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: solar-system
      context:
        resources:
          - index: mgmt
            apiVersion: v1
            kind: ConfigMap
            name: tenant-management
            namespace: solar-system
      generators:
        - template: |
            {{- range $team, $config := (index $.mgmt 0 "data") }}
            {{- $team_config := fromYAML $config }}
            ---
            apiVersion: capsule.clastix.io/v1beta2
            kind: TenantResource
            metadata:
              name: "{{ $team }}-tenant-distribution"
              namespace: solar-system
              ownerReferences:
                - apiVersion: capsule.clastix.io/v1beta2
                  kind: TenantResource
                  name: {{ $.replications.metadata.name | quote }}
                  uid: {{ $.replications.metadata.uid | quote }}
                  controller: true
                  blockOwnerDeletion: true
            spec:
              resyncPeriod: 60s
              serviceAccount:
                name: gateway-api-role-distributor
              resources:
                - namespaceSelector:
                    matchLabels:
                      team: {{ $team }}
                  generators:
                    - template: |
                        ---
                        apiVersion: capsule.clastix.io/v1beta2
                        kind: ResourcePoolClaim
                        metadata:
                          name: "managed-quota"
                          namespace: "{{`{{ $.namespace.metadata.name }}`}}"
                        spec:
                          pool: "solar"
                          claim:
                            {{- $team_config.quota | toYAML | nindent 16 }}
                  rawItems:
                    - apiVersion: rbac.authorization.k8s.io/v1
                      kind: RoleBinding
                      metadata:
                        name: "tenant:{{`{{namespace}}`}}:cr:gateway-api"
                        namespace: "{{`{{namespace}}`}}"
                      subjects:
                      {{- range $team_config.owners }}
                      - kind: {{ .kind }}
                        name: {{ .name }}
                        apiGroup: rbac.authorization.k8s.io
                      {{- end }}
                      roleRef:
                        kind: ClusterRole
                        name: gateway-api-role-distributor
                        apiGroup: rbac.authorization.k8s.io
            {{- end }}
---
# MutatingAdmissionPolicy is cluster-scoped, so the namespace-scoped
# TenantResource above cannot own it. This GlobalTenantResource uses the
# platform reconciler to create one policy and binding for every team Namespace.
apiVersion: capsule.clastix.io/v1beta2
kind: GlobalTenantResource
metadata:
  name: solar-namespace-pod-tolerations
spec:
  scope: Namespace
  resyncPeriod: 60s
  pruningOnDelete: true
  serviceAccount:
    name: gtr-reconciler
    namespace: capsule-system
  tenantSelector:
    matchLabels:
      customer: renewable
  resources:
    - namespaceSelector:
        matchExpressions:
          - key: team
            operator: Exists
      generators:
        - missingKey: error
          template: |
            ---
            apiVersion: admissionregistration.k8s.io/v1beta1
            kind: MutatingAdmissionPolicy
            metadata:
              name: "{{ $.namespace.metadata.name }}-pod-toleration"
            spec:
              failurePolicy: Fail
              reinvocationPolicy: IfNeeded
              matchConstraints:
                resourceRules:
                  - apiGroups:
                      - ""
                    apiVersions:
                      - v1
                    operations:
                      - CREATE
                    resources:
                      - pods
              matchConditions:
                - name: toleration-not-present
                  expression: >-
                    !has(object.spec.tolerations) ||
                    !object.spec.tolerations.exists(t,
                      t.key == "projectcapsule.dev/namespace" &&
                      t.operator == "Equal" &&
                      t.value == "{{ $.namespace.metadata.name }}" &&
                      t.effect == "NoSchedule")
              mutations:
                - patchType: JSONPatch
                  jsonPatch:
                    expression: >-
                      has(object.spec.tolerations)
                        ? [JSONPatch{
                            op: "add",
                            path: "/spec/tolerations/-",
                            value: {
                              "key": "projectcapsule.dev/namespace",
                              "operator": "Equal",
                              "value": "{{ $.namespace.metadata.name }}",
                              "effect": "NoSchedule"
                            }
                          }]
                        : [JSONPatch{
                            op: "add",
                            path: "/spec/tolerations",
                            value: [{
                              "key": "projectcapsule.dev/namespace",
                              "operator": "Equal",
                              "value": "{{ $.namespace.metadata.name }}",
                              "effect": "NoSchedule"
                            }]
                          }]
            ---
            apiVersion: admissionregistration.k8s.io/v1beta1
            kind: MutatingAdmissionPolicyBinding
            metadata:
              name: "{{ $.namespace.metadata.name }}-pod-toleration"
            spec:
              policyName: "{{ $.namespace.metadata.name }}-pod-toleration"
              matchResources:
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: "{{ $.namespace.metadata.name }}"
