{{- $Values := mergeOverwrite (deepCopy $.Values.global.jobs.kubectl) $.Values.jobs -}}

{{- if and (not $.Values.crds.exclusive) $.Values.global.jobs.postDelete.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "capsule.post-delete.name" $ }}"
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: {{ include "capsule.post-delete.component" . | quote }}
    app.kubernetes.io/name: {{ include "capsule.post-delete.component" . | quote }}
    {{- include "capsule.baselabels" . | nindent 4 }}
    {{- include "capsule.selectorLabelInstance" . | nindent 4 }}
    {{- with $Values.labels }}
      {{- . | toYaml | nindent 4 }}
    {{- end }}
  annotations:
    "helm.sh/hook-weight": "-1"
    {{- include "capsule.post-delete.annotations" . | nindent 4 }}
    {{- with $Values.annotations }}
      {{- . | toYaml | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ $Values.backoffLimit }}
  ttlSecondsAfterFinished: {{ $Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      annotations:
        {{- with $Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $.Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/component: {{ include "capsule.post-delete.component" . | quote }}
        app.kubernetes.io/name: {{ include "capsule.post-delete.component" . | quote }}
        {{- include "capsule.selectorLabelInstance" . | nindent 8 }}
        {{- with $Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $.Values.podLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: {{ $Values.restartPolicy }}
      {{- if $Values.podSecurityContext.enabled }}
      securityContext: {{- omit $Values.podSecurityContext "enabled" | toYaml | nindent 8 }}
      {{- end }}
      {{- with $Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "capsule.post-delete.name" . }}
      containers:
        - name: post-delete-job
          image: {{ include "capsule.jobsFullyQualifiedDockerImage" . }}
          imagePullPolicy: {{ $Values.image.pullPolicy }}
          command:
          - "/bin/sh"
          - "-c"
          - |
              set -o errexit ; set -o xtrace ; set -o nounset
              kubectl delete mutatingwebhookconfigurations.admissionregistration.k8s.io {{ include "capsule.fullname" $ }}-dynamic-webhook --ignore-not-found
              kubectl delete validatingwebhookconfigurations.admissionregistration.k8s.io {{ include "capsule.fullname" $ }}-dynamic-webhook --ignore-not-found
          {{- if $Values.securityContext.enabled }}
          securityContext: {{- omit $Values.securityContext "enabled" | toYaml | nindent 12 }}
          {{- end }}
          {{- with $Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
