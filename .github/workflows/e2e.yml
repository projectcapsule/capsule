name: e2e
permissions: {}

on:
  pull_request:
    branches:
      - "*"
    paths:
      - '.github/workflows/e2e.yml'
      - 'api/**'
      - 'controllers/**'
      - 'internal/**'
      - 'pkg/**'
      - 'e2e/*'
      - 'hack/microshift/**'
      - 'Dockerfile'
      - 'go.*'
      - 'main.go'
      - 'Makefile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Testing (CE, ${{ matrix.phase }})
    strategy:
      fail-fast: false
      matrix:
        # The parallel specs and the serial config specs run on separate runners,
        # so a lane takes setup plus the longer phase instead of both phases.
        phase: ['parallel', 'config']
    runs-on:
      labels: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: e2e
        run: sudo E2E_PHASE=${{ matrix.phase }} make e2e

  e2e-openshift-CE:
    name: E2E OpenShift Testing (CE, MicroShift ${{ matrix.version }}, ${{ matrix.phase }})
    strategy:
      fail-fast: false
      matrix:
        version: ['4.21', '4.22'] # tags are pinned in the Makefile (MICROSHIFT_TAG_*)
        # The parallel specs and the serial config specs run on separate runners,
        # like the kind lanes.
        phase: ['parallel', 'config']
    runs-on:
      labels: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: e2e
        run: sudo MICROSHIFT_VERSION=${{ matrix.version }} E2E_PHASE=${{ matrix.phase }} make e2e-openshift

      - name: MicroShift logs
        if: failure()
        run: |
          sudo journalctl -u microshift --no-pager | tail -n 300
          sudo KUBECONFIG=/var/lib/microshift/resources/kubeadmin/kubeconfig kubectl get pods --all-namespaces

  run-e2e:
    name: E2E Testing
    strategy:
      fail-fast: false
      matrix:
        k8s-version:
          - 'v1.33.0'
          - 'v1.34.0'
          - 'v1.35.0'
        phase: ['parallel', 'config']
    runs-on:
      labels: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: e2e (Enterprise)
        run: sudo KUBERNETES_SUPPORTED_VERSION=${{ matrix.k8s-version }} E2E_PHASE=${{ matrix.phase }} make e2e
