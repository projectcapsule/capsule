name: e2e
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - '.github/workflows/e2e.yml'
      - 'hack/observability/**'
      - 'api/**'
      - 'controllers/**'
      - 'internal/**'
      - 'pkg/**'
      - 'e2e/*'
      - 'Dockerfile'
      - 'go.*'
      - 'main.go'
      - 'Makefile'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These jobs execute repository code with monitoring credentials. Never run PR refs.
  e2e:
    name: E2E Testing (CE)
    if: >-
      github.repository == 'projectcapsule/capsule' &&
      startsWith(github.ref, 'refs/heads/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: monitoring
    runs-on:
      labels: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: projectcapsule/capsule
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Create test cluster
        run: sudo make e2e-cluster

      - name: Start run observability
        id: observability
        env:
          MONITORING_USERNAME: ${{ secrets.MONITORING_USERNAME }}
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          OBSERVABILITY_RUN_ID: capsule-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          OBSERVABILITY_REPOSITORY: ${{ github.repository }}
          OBSERVABILITY_REVISION: ${{ github.sha }}
          OBSERVABILITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          sudo --preserve-env=MONITORING_USERNAME,MONITORING_PASSWORD,OBSERVABILITY_RUN_ID,OBSERVABILITY_REPOSITORY,OBSERVABILITY_REVISION,OBSERVABILITY_RUN_URL,GITHUB_OUTPUT,GITHUB_STEP_SUMMARY
          make alloy-install

      - name: Install Capsule
        run: sudo make e2e-install E2E_OBSERVABILITY=${{ steps.observability.outputs.enabled }}

      - name: Run e2e tests
        run: sudo make e2e-exec

      - name: Stop run observability
        if: always() && steps.observability.outputs.started == 'true'
        run: sudo make alloy-uninstall

      - name: Delete successful test cluster
        if: success()
        run: sudo make e2e-destroy

  e2e-openshift-CE:
    name: E2E OpenShift Testing (CE)
    if: >-
      github.repository == 'projectcapsule/capsule' &&
      startsWith(github.ref, 'refs/heads/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: monitoring
    runs-on:
      labels: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: projectcapsule/capsule
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Create test cluster
        run: sudo make e2e-cluster-openshift

      - name: Start run observability
        id: observability
        env:
          MONITORING_USERNAME: ${{ secrets.MONITORING_USERNAME }}
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          OBSERVABILITY_RUN_ID: capsule-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          OBSERVABILITY_REPOSITORY: ${{ github.repository }}
          OBSERVABILITY_REVISION: ${{ github.sha }}
          OBSERVABILITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          sudo --preserve-env=MONITORING_USERNAME,MONITORING_PASSWORD,OBSERVABILITY_RUN_ID,OBSERVABILITY_REPOSITORY,OBSERVABILITY_REVISION,OBSERVABILITY_RUN_URL,GITHUB_OUTPUT,GITHUB_STEP_SUMMARY
          make alloy-install-openshift

      - name: Install Capsule
        run: sudo make e2e-install-openshift E2E_OBSERVABILITY=${{ steps.observability.outputs.enabled }}

      - name: Run e2e tests
        run: sudo make e2e-exec FILTER='&& !skip && !skip-on-openshift'

      - name: Stop run observability
        if: always() && steps.observability.outputs.started == 'true'
        run: sudo make alloy-uninstall

      - name: Delete successful test cluster
        if: success()
        run: sudo make e2e-destroy-openshift

  run-e2e:
    name: E2E Testing
    if: >-
      github.repository == 'projectcapsule/capsule' &&
      startsWith(github.ref, 'refs/heads/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        k8s-version:
          - 'v1.33.0'
          - 'v1.34.0'
          - 'v1.35.0'
    environment: monitoring
    runs-on:
      labels: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: projectcapsule/capsule
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Create test cluster
        run: sudo KUBERNETES_SUPPORTED_VERSION=${{ matrix.k8s-version }} make e2e-cluster

      - name: Start run observability
        id: observability
        env:
          MONITORING_USERNAME: ${{ secrets.MONITORING_USERNAME }}
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          OBSERVABILITY_RUN_ID: capsule-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.k8s-version }}
          OBSERVABILITY_REPOSITORY: ${{ github.repository }}
          OBSERVABILITY_REVISION: ${{ github.sha }}
          OBSERVABILITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          sudo --preserve-env=MONITORING_USERNAME,MONITORING_PASSWORD,OBSERVABILITY_RUN_ID,OBSERVABILITY_REPOSITORY,OBSERVABILITY_REVISION,OBSERVABILITY_RUN_URL,GITHUB_OUTPUT,GITHUB_STEP_SUMMARY
          make alloy-install

      - name: Install Capsule
        run: sudo make e2e-install E2E_OBSERVABILITY=${{ steps.observability.outputs.enabled }}

      - name: Run e2e tests
        run: sudo make e2e-exec

      - name: Stop run observability
        if: always() && steps.observability.outputs.started == 'true'
        run: sudo make alloy-uninstall

      - name: Delete successful test cluster
        if: success()
        run: sudo make e2e-destroy

  e2e-openshift:
    name: E2E Testing (OpenShift)
    if: >-
      github.repository == 'projectcapsule/capsule' &&
      startsWith(github.ref, 'refs/heads/') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        os-version: # https://quay.io/repository/minc-org/minc?tab=tags&tag=latest
          - '4.18.0-okd-scos.9'
          - '4.19.0-okd-scos.17'
    environment: monitoring
    runs-on: ubuntu-latest-8-cores
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: projectcapsule/capsule
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Create test cluster
        run: sudo OS_SUPPORTED_VERSION=${{ matrix.os-version }} make e2e-cluster-openshift

      - name: Start run observability
        id: observability
        env:
          MONITORING_USERNAME: ${{ secrets.MONITORING_USERNAME }}
          MONITORING_PASSWORD: ${{ secrets.MONITORING_PASSWORD }}
          OBSERVABILITY_RUN_ID: capsule-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.os-version }}
          OBSERVABILITY_REPOSITORY: ${{ github.repository }}
          OBSERVABILITY_REVISION: ${{ github.sha }}
          OBSERVABILITY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: >-
          sudo --preserve-env=MONITORING_USERNAME,MONITORING_PASSWORD,OBSERVABILITY_RUN_ID,OBSERVABILITY_REPOSITORY,OBSERVABILITY_REVISION,OBSERVABILITY_RUN_URL,GITHUB_OUTPUT,GITHUB_STEP_SUMMARY
          make alloy-install-openshift

      - name: Install Capsule
        run: sudo make e2e-install-openshift E2E_OBSERVABILITY=${{ steps.observability.outputs.enabled }}

      - name: Run e2e tests
        run: sudo make e2e-exec FILTER='&& !skip && !skip-on-openshift'

      - name: Stop run observability
        if: always() && steps.observability.outputs.started == 'true'
        run: sudo make alloy-uninstall

      - name: Delete successful test cluster
        if: success()
        run: sudo make e2e-destroy-openshift
