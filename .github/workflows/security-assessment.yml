name: Security assessment
permissions: {}

on:
  pull_request:
    paths:
      - 'security/**'
      - 'security-insights.yml'
      - '.github/workflows/security-assessment.yml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.17.1
      - name: Download Security Insights schema
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            https://raw.githubusercontent.com/ossf/security-insights/v2.2.0/spec/schema.cue \
            --output schema.cue
          echo '4e4b61470b5484fc8969f2a8a77ffbe0712a7c8a870c2079188f246c14cd58b1  schema.cue' | sha256sum --check
      - name: Validate official schemas
        run: |
          cue vet -d '#SecurityInsights' schema.cue security-insights.yml
          cue vet -c -d '#CapabilityCatalog' github.com/gemaraproj/gemara@v1.6.0 security/capabilities.yaml
          cue vet -c -d '#ThreatCatalog' github.com/gemaraproj/gemara@v1.6.0 security/threats.yaml
