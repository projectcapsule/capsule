name: Security assessment
permissions: {}

on:
  pull_request:
    paths:
      - 'security/**'
      - 'security-insights.yml'
      - '.github/workflows/security-assessment.yml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate Security Insights
        uses: revanite-io/security-insights-action@85c35a5b75f2772e0462323d7b4fcbab5fc1aff2 # v1.0.0
        with:
          file: security-insights.yml
      - name: Validate official schemas
        run: |
          cue vet -d '#SecurityInsights' schema.cue security-insights.yml
          cue vet -c -d '#CapabilityCatalog' github.com/gemaraproj/gemara@v1.6.0 security/capabilities.yaml
          cue vet -c -d '#ThreatCatalog' github.com/gemaraproj/gemara@v1.6.0 security/threats.yaml
