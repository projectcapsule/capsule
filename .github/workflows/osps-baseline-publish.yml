name: Publish OSPS Baseline
permissions: {}

on:
  # The hub accepts one result per target/catalog every ten minutes.
  schedule:
    - cron: '0 10 * * *'
      timezone: Europe/Zurich
  workflow_dispatch:
    inputs:
      dry-run:
        description: Evaluate and retain bundles without publishing to grc.store
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      # Required by the upstream report job, even when upload-sarif is false.
      security-events: write
    # Keep @v1: grc.store requires refs/tags/v1 in the OIDC signer identity.
    # Do not change this tag or pin it to a commit SHA; publishing will fail.
    # https://github.com/revanite-io/pvtr-publish-results#calling-it
    uses: revanite-io/pvtr-publish-results/.github/workflows/publish.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      target: ${{ vars.GRC_NAMESPACE }}/${{ github.event.repository.name }}@${{ github.sha }}
      license: ${{ vars.GRC_RESULTS_LICENSE }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    secrets:
      config: |
        loglevel: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'trace' || 'info' }}
        targets:
          capsule:
            plugin: openssf/github-repo
            policy:
              catalogs:
                - osps-baseline-2026-08
              applicability:
                - maturity-1
            vars:
              owner: ${{ github.repository_owner }}
              repo: ${{ github.event.repository.name }}
              token: ${{ secrets.PVTR_GITHUB_TOKEN }}
